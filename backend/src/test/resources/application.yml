server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: zoro-academy-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false

app:
  storage:
    provider: "local"
    bunny:
      host: "sg.storage.bunnycdn.com"
      zone: "test-zone"
      password: "test-storage-password"
      cdn-host: "test-cdn.b-cdn.net"

admin:
  email: "${TEST_ADMIN_EMAIL:test-admin@example.com}"
  password: "${TEST_ADMIN_PASSWORD:testAdminPassword123!}"

bunny:
  stream:
    library-id: "${TEST_BUNNY_LIBRARY_ID:123456}"
    api-key: "${TEST_BUNNY_API_KEY:test-bunny-api-key-test}"
    cdn-host: "${TEST_BUNNY_CDN_HOST:vz-test.b-cdn.net}"
    token-auth-key: "${TEST_BUNNY_TOKEN_AUTH_KEY:test-bunny-token-key-test}"
    token-expiration-seconds: 7200
    webhook-secret: "${TEST_BUNNY_WEBHOOK_SECRET:test-webhook-secret}"

jwt:
  secret: "${TEST_JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy0xMjM0NTY3ODkwMTI=}"
  expiration-ms: 604800000

cors:
  allowed-origins: "*"

schedule:
  resources-unlock-minutes: 60

notifications:
  retention-days: 30

