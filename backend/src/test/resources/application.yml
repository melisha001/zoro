  password: "adminPassword123!"

bunny:
  stream:
    library-id: "770045"
    api-key: "test-bunny-api-key-test"
    cdn-host: "vz-test.b-cdn.net"
    token-auth-key: "test-bunny-token-key-test"
    token-expiration-seconds: 7200
    webhook-secret: "test-webhook-secret"

