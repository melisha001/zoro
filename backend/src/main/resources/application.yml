server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: zoro-academy-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zoro_academy}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  storage:
    provider: ${APP_STORAGE_PROVIDER:bunny}
    bunny:
      host: ${BUNNY_STORAGE_HOST}
      zone: ${BUNNY_STORAGE_ZONE}
      password: ${BUNNY_STORAGE_PASSWORD}
      cdn-host: ${BUNNY_STORAGE_CDN_HOST}

bunny:
  stream:
    library-id: ${BUNNY_LIBRARY_ID}
    api-key: ${BUNNY_API_KEY}
    cdn-host: ${BUNNY_CDN_HOST}
    token-auth-key: ${BUNNY_TOKEN_AUTH_KEY}
    token-expiration-seconds: 7200
    webhook-secret: ${BUNNY_WEBHOOK_SECRET}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  password-key: ${ADMIN_PASSWORD_KEY:zoroAcademyDevAdminPwdKey32B123}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

schedule:
  resources-unlock-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
