server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: zoro-academy-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zoro_academy}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

bunny:
  stream:
    library-id: ${BUNNY_LIBRARY_ID}
    api-key: ${BUNNY_API_KEY}
    cdn-host: ${BUNNY_CDN_HOST}
    token-auth-key: ${BUNNY_TOKEN_AUTH_KEY}
    token-expiration-seconds: 7200
    webhook-secret: ${BUNNY_WEBHOOK_SECRET:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
